<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Photograph to follow">
<!--
  Deliberately transparent. This sits inside a bg-surface-2 container, so
  letting the ground show through is what makes it follow the theme; the
  earlier version painted its own dark panel and read as a hole punched in the
  light grid. Brass at low opacity carries on both.
-->
<g fill="none" stroke="#a07c3c" stroke-opacity="0.45" stroke-width="6">
<rect x="430" y="330" width="340" height="250" rx="2"/>
<path d="M430 505l95-85 78 70 60-52 107 96"/>
</g>
<circle cx="676" cy="395" r="26" fill="#a07c3c" fill-opacity="0.4"/>
<text x="600" y="660" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="30" letter-spacing="4.2" fill="#a07c3c" fill-opacity="0.75">PHOTOGRAPH TO FOLLOW</text>
</svg>
