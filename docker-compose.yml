# KVM4 hosts several projects. Every container is capped so a traffic spike or
# a runaway import job on this project cannot starve the others. These limits
# are the single highest-value piece of infrastructure config here.
services:
  api:
    build: ./apps/api
    container_name: lavion-api
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:4000:4000"
    networks: [lavion]
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1g
        reservations:
          memory: 256m
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  redis:
    image: redis:7-alpine
    container_name: lavion-redis
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    networks: [lavion]
    volumes: [redis-data:/data]
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 320m

networks:
  lavion:
    name: lavion
    driver: bridge

volumes:
  redis-data:
